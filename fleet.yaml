helm:
  chart: ./chart
  version: 0.1.0
  values:
    a: "a-from-values"
    b: "b-from-values"
    d: ${ .ClusterLabels.plant }
  valuesFiles:
    - ./values/base-values.yaml
targetCustomizations:
  - name: labelled
    clusterSelector:
      matchLabels:
        plant: A
    helm:
      values:
        b: "b from inner-values"
      valuesFiles:
        - ./values/file-values.yaml